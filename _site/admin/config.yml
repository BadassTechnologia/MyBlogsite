backend:
  name: github
  repo: BadassTechnologia/MyBlogsite
  branch: main
  base_url: https://auth.bloogsite.com
  auth_endpoint: /auth
  site_domain: bloogsite.com

local_backend: true

site_url: https://bloogsite.com
display_url: https://bloogsite.com
logo_url: /assets/img/brand/bloogsite-logo-white.png

media_folder: "src/assets/img/uploads"
public_folder: "/assets/img/uploads"

publish_mode: editorial_workflow

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: title
    summary: "{{title}} — {{category}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "yyyy-MM-dd" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Tech", value: "tech" }
          - { label: "Finance", value: "finance" }
          - { label: "Education", value: "education" }
          - { label: "Lifestyle", value: "lifestyle" }
          - { label: "AI Tools", value: "ai-tools" }
          - { label: "Health", value: "health" }
          - { label: "Travel", value: "travel" }
          - { label: "Trending", value: "trending" }
          - { label: "Marketing", value: "marketing" }
          - { label: "Tech Jobs", value: "tech-jobs" }
      - label: "Author"
        name: "author"
        widget: "select"
        default: "ashok"
        options:
          - { label: "Bloogsite Editorial Team", value: "ashok" }
          - { label: "Guest Author", value: "guest" }
      - { label: "Cover Image", name: "image", widget: "image", required: false, hint: "Optional. A branded fallback is used when no image is supplied." }
      - { label: "Cover Image Description", name: "imageAlt", widget: "string", required: false, hint: "Describe meaningful image content. Leave blank when the image is decorative." }
      - { label: "Short Excerpt", name: "excerpt", widget: "text", required: false, hint: "Shown on cards and listing pages. Keep it to 1-2 sentences." }
      - { label: "Featured ribbon", name: "featured", widget: "boolean", default: false, required: false, hint: "Highlights this article with a Featured ribbon." }
      - { label: "Top article", name: "topArticle", widget: "boolean", default: false, required: false, hint: "Includes this article in the Top articles collection." }
      - { label: "Embedded Video URL", name: "videoUrl", widget: "string", required: false, pattern: ['^https://(www\\.)?(youtube(-nocookie)?\\.com/embed/|player\\.vimeo\\.com/video/).+$', "Use a secure YouTube or Vimeo embed URL."], hint: "Paste an HTTPS YouTube embed or Vimeo player URL. Other providers are not displayed." }
      - { label: "Body", name: "body", widget: "markdown", hint: "For fenced code blocks, switch to Markdown mode and put three backticks on separate lines before and after the code. In Rich Text mode, use the Code Block component." }
      - { label: "Draft (hide from live site)", name: "draft", widget: "boolean", default: false, required: false }

  - name: "authors"
    label: "Author Profiles"
    files:
      - name: "authors"
        label: "All Authors"
        file: "src/_data/authors.json"
        fields:
          - name: "authors"
            label: "Authors"
            widget: "list"
            fields:
              - { label: "Slug (no spaces)", name: "slug", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Avatar", name: "avatar", widget: "image" }
